name: Bug report
description: Something is broken and I can show you how to reproduce it
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: checkboxes
    attributes:
      label: Before you open this
      options:
        - label: I searched the existing issues for this problem
          required: true
        - label: This is not a security report
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: The behaviour you got, with the error or wrong output quoted.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a fresh checkout.
      placeholder: |
        1. Install with ...
        2. Run ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      render: markdown
      value: |
          - OS:
          - Python:
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs or traceback
      description: Optional. Drag files straight into this box.
      render: text
    validations:
      required: false
